{% extends 'games/base.html' %}
{% load static %}

{% block title %}Регистрация — GameLog{% endblock %}

{% block content %}
    <h1><img src="{% static 'icons/user.svg' %}" alt="Регистрация" class="icon page-header-icon"> Регистрация</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Зарегистрироваться</button>
    </form>

    <p>Уже есть аккаунт? <a href="{% url 'login' %}">Войти</a></p>
{% endblock %}
