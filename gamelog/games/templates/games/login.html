{% extends 'games/base.html' %}
{% load static %}

{% block title %}Вход — GameLog{% endblock %}

{% block content %}
    <h1><img src="{% static 'icons/user.svg' %}" alt="Вход" class="icon page-header-icon"> Вход</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Войти</button>
    </form>

    <p>Нет аккаунта? <a href="{% url 'register' %}">Зарегистрироваться</a></p>
{% endblock %}
